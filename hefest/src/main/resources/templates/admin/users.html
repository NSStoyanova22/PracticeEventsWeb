<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Потребители</title>
    <link rel="stylesheet" th:href="@{/css/hefest.css}">
</head>
<body>

<header th:replace="~{fragments :: navigation}"></header>

<main class="site-main">
    <h1>Потребители</h1>

    <a class="button button-primary"
       th:href="@{/admin/users/new}">
        Създай потребител
    </a>

    <form class="user-search" method="get" th:action="@{/admin/users}">
        <label for="user-search-input">Търсене</label>
        <input id="user-search-input" type="search" name="search"
               placeholder="Име, имейл или телефон"
               th:value="${search}">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="direction" th:value="${direction}">
        <input type="hidden" name="size" th:value="${size}">
        <button class="button" type="submit">Търси</button>
        <a class="button" th:if="${not #strings.isEmpty(search)}"
           th:href="@{/admin/users}">Изчисти</a>
    </form>

    <table>
        <thead>
        <tr>
            <th><a th:href="@{/admin/users(search=${search},sort='name',direction=${sort == 'name' and direction == 'asc' ? 'desc' : 'asc'},page=0,size=${size})}">Име</a></th>
            <th><a th:href="@{/admin/users(search=${search},sort='email',direction=${sort == 'email' and direction == 'asc' ? 'desc' : 'asc'},page=0,size=${size})}">Email</a></th>
            <th><a th:href="@{/admin/users(search=${search},sort='phone',direction=${sort == 'phone' and direction == 'asc' ? 'desc' : 'asc'},page=0,size=${size})}">Телефон</a></th>
            <th><a th:href="@{/admin/users(search=${search},sort='role',direction=${sort == 'role' and direction == 'asc' ? 'desc' : 'asc'},page=0,size=${size})}">Роля</a></th>
            <th><a th:href="@{/admin/users(search=${search},sort='active',direction=${sort == 'active' and direction == 'asc' ? 'desc' : 'asc'},page=0,size=${size})}">Статус</a></th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users.content}">
            <td th:text="${user.name}">Име</td>
            <td th:text="${user.email}">email</td>
            <td th:text="${user.phone}">Телефон</td>
            <td th:text="${user.role}">USER</td>

            <td>
                <span th:if="${user.active}">Активен</span>
                <span th:unless="${user.active}">Деактивиран</span>
            </td>

            <td>
                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}">
                    Редактирай
                </a>

                <form th:if="${user.active}"
                      th:action="@{/admin/users/{id}/deactivate(id=${user.id})}"
                      method="post"
                      style="display: inline">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit">
                        Деактивирай
                    </button>
                </form>

                <form th:action="@{/admin/users/{id}/role(id=${user.id})}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <select name="role">
                        <option value="ADMIN"
                                th:selected="${user.role != null and user.role.name() == 'ADMIN'}">
                            ADMIN
                        </option>

                        <option value="USER"
                                th:selected="${user.role != null and user.role.name() == 'USER'}">
                            USER
                        </option>
                    </select>
                    <button type="submit">
                        Смени роля
                    </button>
                </form>

            </td>
        </tr>
        <tr th:if="${users.isEmpty()}">
            <td colspan="6">Няма намерени потребители.</td>
        </tr>
        </tbody>
    </table>

    <nav class="pagination" th:if="${users.totalPages > 0}" aria-label="Странициране">
        <a class="button"
           th:classappend="${users.first} ? ' is-disabled' : ''"
           th:if="${not users.first}"
           th:href="@{/admin/users(search=${search},sort=${sort},direction=${direction},page=${users.number - 1},size=${size})}">← Предишна</a>
        <span>Страница <strong th:text="${users.number + 1}">1</strong> от <strong th:text="${users.totalPages}">1</strong></span>
        <a class="button"
           th:if="${not users.last}"
           th:href="@{/admin/users(search=${search},sort=${sort},direction=${direction},page=${users.number + 1},size=${size})}">Следваща →</a>
    </nav>
</main>

</body>
</html>
