<!DOCTYPE html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8" /><title>Кошче | HefestQueue</title><link rel="stylesheet" th:href="@{/css/hefest.css}" /></head>
<body><header th:replace="~{fragments :: navigation}"></header><main class="site-main reports-page"><h1>Кошче</h1><p>Изтритите събития не се показват в стандартните списъци.</p><div class="report-table-wrap"><table class="report-table"><thead><tr><th>Събитие</th><th>Изтрито</th><th>Изтрил</th><th></th></tr></thead><tbody><tr th:each="event : ${deletedEvents}"><td th:text="${event.title}">Събитие</td><td th:text="${event.deletedAt}">2026-01-01</td><td th:text="${event.deletedBy}">admin</td><td><form method="post" th:action="@{/admin/trash/{id}/restore(id=${event.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit">Възстанови</button></form></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(deletedEvents)}">Кошчето е празно.</p></main></body></html>
