<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Потребители | HefestQueue</title>
    <link rel="stylesheet" th:href="@{/css/hefest.css}" />
</head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main class="site-main">
    <section class="page-heading">
        <div>
            <p class="eyebrow">АДМИНИСТРАЦИЯ</p>
            <h1>Потребители</h1>
        </div>
    </section>

    <p class="message" th:if="${successMessage}" th:text="${successMessage}">Успех</p>
    <p class="message error" th:if="${errorMessage}" th:text="${errorMessage}">Грешка</p>

    <div class="report-table-wrap">
        <table class="report-table">
            <thead>
            <tr>
                <th>Име</th>
                <th>Имейл</th>
                <th>Роля</th>
                <th>Действие</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.name}">Име</td>
                <td th:text="${user.email}">email</td>
                <td>
                    <span class="role-badge role-admin" th:if="${user.role != null and user.role.name() == 'ADMIN'}">АДМИН</span>
                    <span class="role-badge role-manager" th:if="${user.role != null and user.role.name() == 'MANAGER'}">МЕНИДЖЪР</span>
                    <span class="role-badge" th:if="${user.role == null or user.role.name() == 'USER'}">ПОТРЕБИТЕЛ</span>
                </td>
                <td>
                    <form class="inline-form" th:if="${user.role == null or user.role.name() == 'USER'}"
                          th:action="@{/admin/managers/{id}(id=${user.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="manager" value="true" />
                    </form>
                    <form class="inline-form" th:if="${user.role != null and user.role.name() == 'MANAGER'}"
                          th:action="@{/admin/managers/{id}(id=${user.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="manager" value="false" />
                    </form>
                    <span class="event-meta" th:if="${user.role != null and user.role.name() == 'ADMIN'}">—</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="4">Няма потребители.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer class="site-footer">HefestQueue — Платформа за училищни събития и уъркшопи.</footer>
</body>
</html>
