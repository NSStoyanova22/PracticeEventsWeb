<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Потребител</title>
    <link rel="stylesheet" th:href="@{/css/hefest.css}">
</head>
<body>

<header th:replace="~{fragments :: navigation}"></header>

<main class="site-main form-page">

    <h1 th:if="${!isEdit}">Създай потребител</h1>
    <h1 th:if="${isEdit}">Редактирай потребител</h1>

    <p class="message error"
       th:if="${errorMessage != null}"
       th:text="${errorMessage}">
    </p>

    <form class="event-form"
          th:action="${actionUrl}"
          th:object="${userForm}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="name">Име</label>
        <input id="name"
               type="text"
               th:field="*{name}"
               required>

        <label for="email">Email</label>
        <input id="email"
               type="email"
               th:field="*{email}"
               required>

        <label for="phone">Телефон</label>
        <input id="phone"
               type="tel"
               th:field="*{phone}"
               required>

        <div th:if="${!isEdit}">
            <label for="password">Парола</label>
            <input id="password"
                   type="password"
                   th:field="*{password}"
                   required>
        </div>

        <div th:if="${!isEdit}">
            <label for="role">Роля</label>
            <select id="role"
                    th:field="*{role}"
                    required>

                <option value="">Избери роля</option>

                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}">
                </option>
            </select>
        </div>

        <button type="submit">
            Запази
        </button>
    </form>

</main>

</body>
</html>
