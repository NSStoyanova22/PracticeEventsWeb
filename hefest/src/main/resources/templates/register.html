<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация | HefestQueue</title>
    <link rel="stylesheet" th:href="@{/css/hefest.css}" />
</head>
<body>
<header th:replace="~{fragments :: navigation}"></header>

<main class="site-main form-page">
    <p class="eyebrow">HEFESTQUEUE</p>
    <h1>Създайте профил</h1>
    <p class="lead">Регистрирайте се, за да участвате в събития.</p>
    <form class="event-form" th:action="@{/register}" th:object="${registrationForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label for="name">Име</label>
        <input id="name" type="text" th:field="*{name}" required="required" />
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

        <label for="email">Имейл</label>
        <input id="email" type="email" th:field="*{email}" required="required" />
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="phone">Телефон</label>
        <input id="phone" type="tel" th:field="*{phone}" required="required" />
        <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

        <label for="password">Парола</label>
        <input id="password" type="password" th:field="*{password}" required="required" />
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <label for="passwordConfirmation">Потвърди паролата</label>
        <input id="passwordConfirmation" type="password" th:field="*{passwordConfirmation}" required="required" />
        <span class="field-error" th:if="${#fields.hasErrors('passwordConfirmation')}" th:errors="*{passwordConfirmation}"></span>

        <button type="submit">Регистрация</button>
    </form>
</main>

<footer class="site-footer">HefestQueue — Платформа за училищни събития и уъркшопи.</footer>
</body>
</html>
