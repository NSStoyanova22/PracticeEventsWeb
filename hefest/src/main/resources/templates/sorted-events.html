<h1>Sorted Events</h1>

<div th:each="event : ${events}">

    <h2 th:text="${event.title}"></h2>

    <p>
        Registered:
        <span th:text="${registeredCounts[event.id]}"></span>
    </p>

    <p>
        Available:
        <span th:text="${availablePlaces[event.id]}"></span>
    </p>

    <p>
        Capacity:
        <span th:text="${capacityPercent[event.id]} + '%'"></span>
    </p>

</div>
