<!DOCTYPE html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8" /><title th:text="${collection.name}">Колекция</title><link rel="stylesheet" th:href="@{/css/hefest.css}" /></head>
<body><header th:replace="~{fragments :: navigation}"></header><main class="site-main reports-page"><a class="back-link" th:href="@{/my-lists}">← Моите списъци</a><h1 th:text="${collection.name}">Колекция</h1><ul><li th:each="item : ${items}"><a th:href="@{/events/{id}(id=${item.event.id})}" th:text="${item.event.title}">Събитие</a></li></ul><p th:if="${#lists.isEmpty(items)}">Колекцията е празна.</p></main></body></html>
