<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="navigation">
    <a class="brand" th:href="@{/events}">
        <span class="brand-mark">H</span>
        <span class="brand-name">HefestQueue</span>
    </a>
    <nav class="main-nav">
        <a th:href="@{/events}">Събития</a>
        <a th:href="@{/events/new}">Създай събитие</a>
        <a th:href="@{/library}">Библиотека</a>
        <a th:href="@{/reports}">Доклади</a>
        <a th:if="${isAdmin}" th:href="@{/admin/managers}">Потребители</a>
        <a th:if="${isAdmin}" th:href="@{/admin/audit}">Одит</a>
        <a th:if="${isAdmin}" th:href="@{/admin/chat}">Чат <span class="chat-nav-badge" data-chat-badge hidden>0</span></a>
        <span class="nav-divider"></span>
        <span class="user-name" th:if="${currentUser != null}" th:text="${currentUser.name}">Потребител</span>
        <a th:if="${currentUser == null}" th:href="@{/login}">Вход</a>
        <a th:if="${currentUser == null}" th:href="@{/register}">Регистрация</a>
        <form class="inline-form" th:if="${currentUser != null}" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="link-button" type="submit">Изход</button>
        </form>
    </nav>

    <!-- Live chat with an admin. Admins answer from /admin/chat; chat.js only updates their nav badge. -->
    <div class="chat-widget" id="chat-widget"
         th:attr="data-mode=${isAdmin ? 'admin' : (currentUser != null ? 'user' : 'anon')},
                  data-base=@{/},
                  data-csrf-header=${_csrf.headerName},
                  data-csrf-token=${_csrf.token}">
        <th:block th:unless="${isAdmin}">
            <button class="chat-toggle" type="button" aria-controls="chat-panel" aria-expanded="false">
                <span aria-hidden="true">💬</span> Попитай
                <span class="chat-unread-dot" hidden></span>
            </button>
            <section class="chat-panel" id="chat-panel" hidden aria-label="Чат с администратор">
                <header class="chat-panel-head">
                    <div>
                        <strong>Помощ от екипа</strong>
                        <span>Администратор ще ви отговори тук.</span>
                    </div>
                    <button class="chat-close" type="button" aria-label="Затвори">×</button>
                </header>
                <div class="chat-messages" aria-live="polite">
                    <p class="chat-hint">Здравейте! Задайте въпрос за събитията и проектите — отговаря реален човек от екипа.</p>
                </div>
                <form class="chat-form" th:if="${currentUser != null}">
                    <textarea name="content" rows="2" maxlength="2000" placeholder="Напишете въпрос…" required></textarea>
                    <button type="submit">Изпрати</button>
                </form>
                <p class="chat-login" th:if="${currentUser == null}">
                    <a th:href="@{/login}">Влезте</a>, за да зададете въпрос.
                </p>
            </section>
        </th:block>
    </div>
    <script th:src="@{/js/chat.js}" defer></script>
</header>
</body>
</html>
