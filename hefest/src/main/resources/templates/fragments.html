<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="navigation">
    <a class="brand" th:href="@{/events}">
        <span class="brand-mark">H</span>
        <span class="brand-name">HefestQueue</span>
    </a>
    <nav class="main-nav">
        <a th:href="@{/events}">Събития</a>
        <a th:href="@{/events/new}">Създай събитие</a>
        <a th:href="@{/reports}">Доклади</a>
        <span class="nav-divider"></span>
        <span class="user-name" th:if="${currentUser != null}" th:text="${currentUser.name}">Потребител</span>
        <a th:if="${currentUser == null}" th:href="@{/login}">Вход</a>
        <a th:if="${currentUser == null}" th:href="@{/register}">Регистрация</a>
        <form class="inline-form" th:if="${currentUser != null}" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="link-button" type="submit">Изход</button>
        </form>
    </nav>
</header>
</body>
</html>
