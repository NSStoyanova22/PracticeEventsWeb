<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${libraryResource.title} + ' | HefestQueue'">Ресурс | HefestQueue</title>
    <link rel="stylesheet" th:href="@{/css/hefest.css}" />
</head>
<body>
<header th:replace="~{fragments :: navigation}"></header>
<main class="detail-main">
    <a class="back-link" th:href="@{/library}">← Назад към библиотеката</a>
    <article class="event-detail" th:object="${libraryResource}">
        <div class="detail-heading">
            <div>
                <p class="eyebrow">РЕСУРС</p>
                <h1 th:text="*{title}">Заглавие</h1>
                <p class="event-meta" th:text="${#temporals.format(libraryResource.createdAt, 'dd.MM.yyyy')}">01.01.2026</p>
            </div>
            <div class="library-admin-actions" th:if="${canEditLibrary}">
                <a class="button" th:href="@{/admin/library/{id}/edit(id=*{id})}">Редактирай</a>
                <form class="inline-form" th:if="${isAdmin}" th:action="@{/admin/library/{id}/delete(id=*{id})}" method="post"
                      onsubmit="return confirm('Да изтрия ли ресурса?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="button button-danger" type="submit">Изтрий</button>
                </form>
            </div>
        </div>

        <p class="event-description detail-description" th:text="*{description}">Описание</p>

        <section class="library-section" th:if="${not #lists.isEmpty(libraryResource.images)}">
            <h2>Снимки</h2>
            <div class="library-gallery">
                <a th:each="img : *{images}" th:href="@{/uploads/{f}(f=${img})}" target="_blank" rel="noopener">
                    <img th:src="@{/uploads/{f}(f=${img})}" alt="Снимка към ресурса" loading="lazy" />
                </a>
            </div>
        </section>

        <section class="library-section" th:if="${not #lists.isEmpty(libraryResource.videos)}">
            <h2>Видеа</h2>
            <video class="library-video" th:each="vid : *{videos}" th:src="@{/uploads/{f}(f=${vid})}"
                   controls preload="metadata"></video>
        </section>

        <section class="library-section library-sources" th:if="${not #lists.isEmpty(libraryResource.sourceList)}">
            <h2>Източници</h2>
            <ol>
                <li th:each="src : *{sourceList}">
                    <a th:if="${#strings.startsWith(src, 'http://') or #strings.startsWith(src, 'https://')}"
                       th:href="${src}" th:text="${src}" target="_blank" rel="noopener noreferrer">https://…</a>
                    <span th:unless="${#strings.startsWith(src, 'http://') or #strings.startsWith(src, 'https://')}"
                          th:text="${src}">Източник</span>
                </li>
            </ol>
        </section>
    </article>
</main>
<footer class="detail-footer">HefestQueue — Платформа за училищни събития и уъркшопи.</footer>
</body>
</html>
